name: build

on:
  workflow_dispatch:
  repository_dispatch:
    types: [feed-updated]
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 = 北京 02:00
  push:
    branches: [main]
    paths:
      - "overlay/**"
      - "patches/**"
      - "scripts/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # release 模式要建 tag 与 Release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # checkout 内部会跑 git init；不设默认分支名的话每次都会打一串 hint
      - name: 设定 git 默认分支名
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v7

      # feed 流水线部署完 Pages 后会 repository_dispatch 过来。build.sh 的
      # --check-feed 会短轮询线上 source-lock.json（默认 15 次 × 2 秒）等 CDN 铺开；
      # 超过窗口仍拿不到才跳过，不把空窗期变成一次误红。
      # 手动/定时/push 触发不走跳过逻辑，仍由 build.sh 的硬检查报错。
      - name: 检查 feed 是否就绪（dispatch 触发）
        id: feed
        env:
          EVENT_NAME: ${{ github.event_name }}
          FEED_EXPECTED_BUILD_ID: ${{ github.event.client_payload.feed_run_id }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = repository_dispatch ] && ! bash scripts/build.sh --check-feed; then
            echo "FEED_READY=false" >> "$GITHUB_ENV"
            echo "::notice::线上 feed 尚未带上配套包，跳过本次构建，等待下一次 feed 发布"
          else
            echo "FEED_READY=true" >> "$GITHUB_ENV"
          fi

      - name: 依赖
        if: env.FEED_READY != 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential libncurses-dev gawk gettext libssl-dev unzip \
            rsync zstd file wget curl ca-certificates jq python3 swig cpio qemu-utils

      - name: 同步上游 YAOF
        if: env.FEED_READY != 'false'
        run: bash scripts/sync-upstream.sh

      - name: 构建
        if: env.FEED_READY != 'false'
        run: bash scripts/build.sh

      - name: 产物
        if: env.FEED_READY != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: yunwrt-image
          path: |
            build/artifact/*
            build-log/*.json
          if-no-files-found: error

      - name: 生成校验和
        if: env.FEED_READY != 'false'
        run: |
          set -euo pipefail
          ver="$(jq -r '.openwrt_version' "$(ls -1 build-log/*.json | tail -1)")"
          [ -n "${ver}" ] && [ "${ver}" != "null" ]
          echo "OPENWRT_VERSION=${ver}" >> "$GITHUB_ENV"
          cd build/artifact
          sha256sum YunWrt-*.img.gz YunWrt-*.vhdx.gz > "YunWrt-${ver}.sha256sum"
          cat "YunWrt-${ver}.sha256sum"

      # 规则对齐 SWrt：tag 为 <平台>-<上游版本>，Release 名带产品名，不是 prerelease。
      # 每次构建都发布，同一上游版本直接覆盖资产（先删旧资产再传，避免按日期累积）。
      - name: 创建或更新 Release
        if: env.FEED_READY != 'false'
        uses: ncipollo/release-action@v1.21.0
        with:
          name: YunWrt-${{ env.OPENWRT_VERSION }}
          tag: X86-${{ env.OPENWRT_VERSION }}
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          updateOnlyUnreleased: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: build/artifact/*.img.gz,build/artifact/*.vhdx.gz,build/artifact/*.sha256sum
