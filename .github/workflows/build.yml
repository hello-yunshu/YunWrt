name: build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 = 北京 02:00
  push:
    branches: [main]
    paths:
      - "overlay/**"
      - "patches/**"
      - "scripts/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: 依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential libncurses-dev gawk gettext libssl-dev unzip \
            rsync zstd file wget curl ca-certificates jq python3 swig cpio

      - name: 同步上游 YAOF
        run: bash scripts/sync-upstream.sh

      - name: 构建
        run: bash scripts/build.sh

      - name: 产物
        uses: actions/upload-artifact@v7
        with:
          name: yunwrt-image
          path: |
            build/artifact/*
            build-log/*.json
          if-no-files-found: error
