name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: 设定 git 默认分支名
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 门禁自检：注入假 token 必须让它非 0 退出，否则说明门禁形同虚设
      - name: 自检
        run: bash scripts/scan-secrets.sh --self-test

      - name: 工作树扫描
        run: bash scripts/scan-secrets.sh

      - name: 全历史扫描
        run: bash scripts/scan-secrets.sh --history

      - name: 全量对象扫描
        run: bash scripts/scan-secrets.sh --objects
